name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check custom_components tests
      - run: ruff format --check custom_components tests
      - run: python -m unittest discover -s tests -v
      - name: Build and verify release archive
        run: python scripts/build_release.py "${GITHUB_REF_NAME}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/fems_sunspec_bridge.zip --title "SunSpec Bridge ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
